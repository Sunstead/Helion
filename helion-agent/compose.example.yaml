# helion-agent — drop-in Compose service.
#
# Written to match the Jupiter stack's conventions: `helion.service` labels so
# the agent shows up in its own dashboard, and a Watchtower opt-in label.
#
# To add it to that repo, save this as `compose/helion.yml` and add
#   - path: compose/helion.yml
#     project_directory: .
# to the `include:` list in docker-compose.yml.
#
# Setup, once:
#   echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> .env
#
# The image also serves the web UI on :7700, so the Caddy entry below gives you
# the site and the address for the desktop app in one.

services:
  helion-agent:
    image: ghcr.io/sunstead/helion-agent:latest
    container_name: helion-agent
    restart: unless-stopped

    # REQUIRED, not a convenience. /proc/net/dev is rendered from the reading
    # process's network namespace and sysinfo has no HOST_PROC escape hatch,
    # so without host networking the agent reports the container's own veth
    # instead of the machine's interfaces.
    #
    # Consequences: `ports:` does not apply (the agent binds :7700 on the host
    # directly), and it is NOT on the `homelab` bridge — so Caddy must reach it
    # via host.docker.internal.
    #
    # tailscale in this stack already uses host networking, so this is not a
    # new pattern here.
    network_mode: host

    read_only: true                       # rootfs immutable; SQLite is on the named volume
    cap_drop: [ALL]                       # :7700 is above 1024, so no CAP_NET_BIND_SERVICE
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    group_add: ["${DOCKER_GID}"]          # uid 65532 can't read docker.sock without this

    environment:
      HELION_AGENT_CONFIG: /etc/helion-agent/agent.toml
      HELION_NODE_NAME: homelab
      # Named as ${HOME_DOMAIN} in agent.toml; the container sees only what's
      # listed here, so pass every variable the file uses.
      HOME_DOMAIN: ${HOME_DOMAIN:?set HOME_DOMAIN in .env}
      RUST_LOG: "info,helion_agent=info"
      TZ: ${TZ:-Etc/UTC}
      # Only with [[peers]]: the secret every peer shares.
      # HELION_AGENT_PEER_TOKEN: ${HELION_AGENT_PEER_TOKEN}

    volumes:
      - ./helion-agent.toml:/etc/helion-agent/agent.toml:ro

      # NOTE: `:ro` on a unix socket is NOT a security control. The flag applies
      # to the inode, not the protocol — anyone who can connect() to this socket
      # has the full Docker API, which is root-equivalent on the host. The real
      # controls are `allow_actions` in the config and network isolation.
      #
      # This mounts the socket file itself, so when dockerd restarts (an
      # upgrade, with live-restore keeping this container up) the container
      # keeps the old, deleted socket. After a minute of failed calls with the
      # socket still there, the agent exits non-zero so `restart:` brings it
      # back with the new one. Keep a restart policy.
      - /var/run/docker.sock:/var/run/docker.sock

      # The host's filesystems. The bind is recursive and `rslave` follows
      # later mounts, so every drive the host mounts appears under it and is
      # reported by its host path (see [[host.disks]] in the config).
      - /:/host/rootfs:ro,rslave

      # Backups: the status file scripts/backup.sh writes, and the systemd
      # timer stamp whose mtime independently proves the timer fired.
      - ${BACKUP_PATH:-/srv/backups}:/host/backups:ro
      - /var/lib/systemd/timers:/host/systemd-timers:ro

      # Tailnet devices ([tailscale] in the config). The tailscale container
      # has to put its socket here: TS_SOCKET=/var/run/tailscale/tailscaled.sock
      # plus the same bind mount. tailscaled grants non-root callers read only.
      - /var/run/tailscale:/host/tailscale

      - helion_agent_data:/var/lib/helion-agent   # SQLite; the only writable path

    labels:
      helion.service: helion
      helion.service.description: Homelab monitoring agent
      helion.service.url: helion.${HOME_DOMAIN}
      com.centurylinklabs.watchtower.enable: "true"

volumes:
  helion_agent_data:

# Caddyfile entry — the agent is on host networking, so reach it the same way
# wol-waker is reached:
#
#     @helion host helion.{$HOME_DOMAIN}
#     handle @helion {
#         reverse_proxy host.docker.internal:7700
#     }
#
# Putting Caddy in front means you can firewall :7700 off the LAN entirely and
# let Authentik/Cloudflare handle who gets in.
