[package]
name = "helion-agent"
version = "0.15.0"
edition = "2021"
license = "MIT"

[dependencies]
helion-common = { path = "../helion-common" }

axum = { version = "0.7", features = ["ws"] }
# Trimmed from `full`: the agent needs a runtime, a listener, timers, channels
# and signal handling. `process` is absent because the agent never shells out.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "io-util",
    "fs",
    "signal",
] }
tokio-stream = { version = "0.1", features = ["time", "sync"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "fs"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

sysinfo = "0.39.5"
bollard = "0.17"
futures-util = "0.3"

# `bundled` compiles SQLite into the binary, so the final image needs no
# libsqlite3 — which is what makes a distroless base viable.
rusqlite = { version = "0.32", features = ["bundled"] }

# OIDC: discovery and JWKS over HTTPS, then offline JWT checks. rustls with
# bundled roots, so the distroless image needs no CA store; pure-Rust
# crypto, so the build needs no C toolchain beyond what's there.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
# Paused time, for tests of loops that run on timers.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
