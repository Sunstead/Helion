[package]
name = "app"
version = "0.15.0"
description = "Homelab dashboard"
authors = ["Sunstead"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-os = "2"
# Desktop notifications for new problems, and for a node that stops answering.
tauri-plugin-notification = "2"
# OS credential store for per-node agent tokens.
# `apple-native`/`windows-native`/`sync-secret-service` are the platform backends.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Sign-in (src/oidc.rs): the code exchange and refreshes happen here, so the
# refresh token goes straight to the keychain and never reaches the webview.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"

# In-app updates from GitHub releases, and the relaunch after one. A phone
# updates through its store.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

